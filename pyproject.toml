[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nn-mcp-auth"
version = "0.2.2"
description = "Shared OAuth 2.0 (Authorization Code + PKCE + Client Credentials) and bearer middleware for NN Studio MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40.0,<1.0.0",
  "python-multipart>=0.0.7,<1.0.0",
  "redis>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "fakeredis>=2.0.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nn_mcp_auth"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
check_untyped_defs = true
disallow_incomplete_defs = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
